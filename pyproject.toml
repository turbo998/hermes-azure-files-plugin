[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-azure-files-plugin"
version = "0.1.0"
description = "Hermes Agent toolset plugin for Azure Blob Storage / Azure Files (BlobFuse2 mount + SDK direct ops)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "turbo998 Chen Qi", email = "chen.qi@example.com" },
]
dependencies = [
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_azure_files"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "azure_live: tests that hit real Azure endpoints (skipped by default)",
]
